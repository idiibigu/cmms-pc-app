<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>idiibi CMMS — Sign In</title>
<style>
  :root { --accent: #2563eb; }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: system-ui, -apple-system, sans-serif;
    background: #0f172a; color: #f1f5f9;
  }
  .card { width: 380px; padding: 32px; background: #1e293b; border-radius: 16px; box-shadow: 0 20px 50px rgba(0,0,0,.4); text-align: center; }
  #logo { width: 56px; height: 56px; border-radius: 12px; object-fit: contain; margin-bottom: 12px; background: #0f172a; }
  h1 { font-size: 16px; margin: 0 0 20px; color: #cbd5e1; font-weight: 700; }
  label { display: block; text-align: left; font-size: 12px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px; }
  input {
    width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid #334155;
    background: #0f172a; color: #f1f5f9; font-size: 14px; margin-bottom: 16px;
  }
  input:focus { outline: none; border-color: var(--accent); }
  button {
    width: 100%; padding: 12px; border: 0; border-radius: 10px; background: var(--accent);
    color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; transition: filter .12s ease;
  }
  button:hover { filter: brightness(0.88); }
  button:disabled { opacity: .6; cursor: default; }
  .error { color: #f87171; font-size: 12px; margin-top: 12px; min-height: 16px; }
</style>
</head>
<body>
  <div class="card">
    <img id="logo" src="" alt="" hidden>
    <h1 id="company-name">idiibi CMMS</h1>
    <form id="login-form">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" autofocus>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password">
      <button type="submit" id="btn-login">Sign In</button>
    </form>
    <div class="error" id="error"></div>
  </div>
  <script src="login.js"></script>
</body>
</html>
