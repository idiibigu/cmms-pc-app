<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>idiibi CMMS — Connect</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: system-ui, -apple-system, sans-serif;
    background: #0f172a; color: #f1f5f9;
  }
  .card { width: 380px; padding: 32px; background: #1e293b; border-radius: 16px; box-shadow: 0 20px 50px rgba(0,0,0,.4); }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p { font-size: 13px; color: #94a3b8; margin: 0 0 20px; }
  label { display: block; font-size: 12px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px; }
  input {
    width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid #334155;
    background: #0f172a; color: #f1f5f9; font-size: 14px; margin-bottom: 6px;
  }
  input:focus { outline: none; border-color: #2563eb; }
  .hint { font-size: 11px; color: #64748b; margin-bottom: 18px; }
  button {
    width: 100%; padding: 12px; border: 0; border-radius: 10px; background: #2563eb;
    color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button:hover { background: #1d4ed8; }
  button:disabled { opacity: .6; cursor: default; }
  .error { color: #f87171; font-size: 12px; margin-top: 10px; min-height: 16px; }
</style>
</head>
<body>
  <div class="card">
    <h1>Connect to your company</h1>
    <p>Enter the web address of your idiibi CMMS.</p>
    <label for="app-url">App URL</label>
    <input id="app-url" type="text" placeholder="https://your-company.example.com" autofocus>
    <div class="hint">Must start with https:// — this app never connects over an unencrypted address.</div>
    <button id="btn-continue">Continue</button>
    <div class="error" id="error"></div>
  </div>
  <script src="url-prompt.js"></script>
</body>
</html>
