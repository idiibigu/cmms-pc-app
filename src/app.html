<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>idiibi CMMS</title>
<style>
  :root {
    --accent: #2563eb;
    --accent-soft: color-mix(in srgb, var(--accent) 15%, white);
    --bg: #f1f5f9;
    --surface: #ffffff;
    --border: #e2e8f0;
    --text: #0f172a;
    --text-sub: #64748b;
    --sidebar-bg: #0f172a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); }

  #sidebar { width: 232px; flex-shrink: 0; background: var(--sidebar-bg); color: #f1f5f9; display: flex; flex-direction: column; padding: 18px 12px; }
  #sidebar .brand { display: flex; align-items: center; gap: 10px; padding: 6px 8px 22px; }
  #sidebar .brand img { width: 34px; height: 34px; border-radius: 9px; object-fit: contain; background: #fff; }
  #sidebar .brand span { font-weight: 700; font-size: 14px; line-height: 1.2; }
  #sidebar .section-label { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: #64748b; font-weight: 700; padding: 14px 10px 6px; }
  .nav-btn {
    display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; margin-bottom: 2px;
    border: 0; border-radius: 9px; background: transparent; color: #94a3b8; font-size: 13px; font-weight: 600;
    text-align: left; cursor: pointer; transition: background .1s ease, color .1s ease;
  }
  .nav-btn:hover { background: #1e293b; color: #e2e8f0; }
  .nav-btn.active { background: var(--accent); color: #fff; }
  #sidebar .spacer { flex: 1; }

  #loading-bar { position: fixed; top: 0; left: 232px; right: 0; height: 3px; z-index: 999; background: transparent; pointer-events: none; }
  #loading-bar .fill { height: 100%; width: 30%; background: var(--accent); transform: translateX(-100%); }
  #loading-bar.active .fill { animation: loading-slide 1s ease-in-out infinite; }
  @keyframes loading-slide { 0% { transform: translateX(-100%); } 50% { transform: translateX(150%); } 100% { transform: translateX(350%); } }
  #topbar { height: 56px; flex-shrink: 0; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 24px; gap: 12px; }
  #topbar .crumb { font-size: 13px; color: var(--text-sub); }
  #topbar .crumb strong { color: var(--text); }
  #topbar .spacer { flex: 1; }
  #topbar button { padding: 7px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); font-size: 12px; font-weight: 600; color: var(--text-sub); cursor: pointer; }
  #topbar button:hover { background: var(--bg); }

  #shell { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #main { flex: 1; overflow-y: auto; padding: 26px 32px; }
  #main h2 { margin: 0 0 4px; font-size: 19px; }
  #main .sub { color: var(--text-sub); font-size: 13px; margin-bottom: 20px; }
  .back-link { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: var(--accent); cursor: pointer; margin-bottom: 10px; }
  .detail-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 18px; }
  .detail-tab-btn { padding: 9px 14px; border: 0; background: transparent; font-size: 12.5px; font-weight: 600; color: var(--text-sub); cursor: pointer; border-bottom: 2px solid transparent; transition: color .12s ease, border-color .12s ease; }
  .detail-tab-btn:hover { color: var(--text); }
  .detail-tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  .doc-body { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px 24px; font-size: 13px; line-height: 1.7; }
  .doc-body h3 { font-size: 14px; margin: 20px 0 8px; }
  .doc-body h3:first-child { margin-top: 0; }
  .doc-body ul { margin: 4px 0 0; padding-left: 18px; }
  .changelog-entry { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 20px; margin-bottom: 14px; }
  .changelog-entry .ver { font-weight: 800; color: var(--accent); font-size: 13px; }
  .changelog-entry .date { color: var(--text-sub); font-size: 11px; margin-left: 8px; }
  .changelog-entry h4 { margin: 4px 0 8px; font-size: 14px; }
  .changelog-entry ul { margin: 0; padding-left: 18px; font-size: 12.5px; line-height: 1.7; }
  .pager { display: flex; align-items: center; gap: 10px; margin-top: 14px; font-size: 12.5px; color: var(--text-sub); }
  .pager button { padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); font-size: 12px; font-weight: 600; color: var(--text); cursor: pointer; }
  .pager button:disabled { opacity: .4; cursor: default; }
  .toolbar { display: flex; gap: 8px; margin-bottom: 14px; }
  .toolbar button, .toolbar label.btn-like {
    padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface);
    font-size: 12.5px; font-weight: 600; color: var(--text); cursor: pointer;
  }
  .toolbar .primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .toolbar .danger { color: #dc2626; border-color: #fecaca; }
  .modal-backdrop { position: fixed; inset: 0; background: rgba(15,23,42,.5); display: flex; align-items: center; justify-content: center; z-index: 500; }
  .modal-card { width: 420px; background: var(--surface); border-radius: 14px; padding: 24px; box-shadow: 0 20px 50px rgba(0,0,0,.3); }
  .modal-card h3 { margin: 0 0 16px; font-size: 15px; }
  .modal-card label { display: block; font-size: 12px; font-weight: 600; color: var(--text-sub); margin: 12px 0 4px; }
  .modal-card input, .modal-card select { width: 100%; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--border); font-size: 13px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
  .row-check { width: 32px; }

  table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: 12px; overflow: hidden; border: 1px solid var(--border); }
  th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-sub); background: #f8fafc; padding: 10px 14px; border-bottom: 1px solid var(--border); }
  td { padding: 10px 14px; font-size: 13px; border-bottom: 1px solid #f1f5f9; }
  tr:last-child td { border-bottom: 0; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover td { background: #f8fafc; }

  .kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 24px; }
  .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; }
  .kpi .lbl { font-size: 11px; text-transform: uppercase; color: var(--text-sub); font-weight: 600; margin-bottom: 6px; }
  .kpi .val { font-size: 26px; font-weight: 800; }

  .section-block { margin-bottom: 26px; }
  .section-block h3 { font-size: 14px; margin: 0 0 10px; }

  .state-msg { color: var(--text-sub); font-size: 13px; padding: 20px 0; }
  .error-msg { color: #dc2626; font-size: 13px; padding: 12px 0; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; background: var(--accent-soft); color: var(--accent); }
</style>
</head>
<body>
  <div id="sidebar">
    <div class="brand"><img id="logo" src="" alt="" hidden><span id="company-name">idiibi CMMS</span></div>
    <div class="section-label">Overview</div>
    <button class="nav-btn active" data-view="dashboard">Dashboard</button>
    <div class="section-label">Operations</div>
    <button class="nav-btn" data-view="equipment">Equipment</button>
    <button class="nav-btn" data-view="tasks">Work Orders</button>
    <button class="nav-btn" data-view="categories">WO Categories</button>
    <button class="nav-btn" data-view="projects">Projects</button>
    <button class="nav-btn" data-view="checklists">Routine Checklists</button>
    <div class="section-label">Safety &amp; Facilities</div>
    <button class="nav-btn" data-view="events">Project Events</button>
    <button class="nav-btn" data-view="firealarm">Fire Alarm</button>
    <button class="nav-btn" data-view="meters">Utility Meters</button>
    <button class="nav-btn" data-view="warehouse">Warehouse</button>
    <div class="section-label">Business</div>
    <button class="nav-btn" data-view="quotations">Quotations</button>
    <div class="section-label">Administration</div>
    <button class="nav-btn" data-view="users">Users</button>
    <button class="nav-btn" data-view="notifications">Notifications</button>
    <button class="nav-btn" data-view="attendance">Attendance</button>
    <div class="section-label">Help</div>
    <button class="nav-btn" data-view="changelog">What's New</button>
    <button class="nav-btn" data-view="docs">Documentation</button>
    <div class="spacer"></div>
    <div class="section-label" id="app-version-label" style="padding-top:0;"></div>
    <button class="nav-btn" id="btn-logout">Log Out</button>
  </div>
  <div id="shell">
    <div id="loading-bar"><div class="fill"></div></div>
    <div id="topbar">
      <div class="crumb" id="crumb">Dashboard</div>
      <div class="spacer"></div>
      <button id="btn-refresh">Refresh</button>
    </div>
    <div id="main"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
