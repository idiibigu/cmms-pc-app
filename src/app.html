<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>idiibi CMMS</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; font-family: system-ui, -apple-system, sans-serif; background: #f1f5f9; color: #0f172a; }
  #sidebar { width: 220px; flex-shrink: 0; background: #0f172a; color: #f1f5f9; display: flex; flex-direction: column; padding: 16px 10px; }
  #sidebar .brand { display: flex; align-items: center; gap: 10px; padding: 8px 10px 20px; }
  #sidebar .brand img { width: 32px; height: 32px; border-radius: 8px; object-fit: contain; }
  #sidebar .brand span { font-weight: 700; font-size: 14px; }
  .nav-btn {
    display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px; margin-bottom: 4px;
    border: 0; border-radius: 10px; background: transparent; color: #94a3b8; font-size: 13px; font-weight: 600;
    text-align: left; cursor: pointer;
  }
  .nav-btn:hover { background: #1e293b; color: #e2e8f0; }
  .nav-btn.active { background: #2563eb; color: #fff; }
  #sidebar .spacer { flex: 1; }
  #main { flex: 1; overflow-y: auto; padding: 28px 32px; }
  #main h2 { margin: 0 0 4px; font-size: 20px; }
  #main .sub { color: #64748b; font-size: 13px; margin-bottom: 20px; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: #64748b; background: #f8fafc; padding: 10px 14px; border-bottom: 1px solid #e2e8f0; }
  td { padding: 10px 14px; font-size: 13px; border-bottom: 1px solid #f1f5f9; }
  tr:last-child td { border-bottom: 0; }
  .kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 24px; }
  .kpi { background: #fff; border-radius: 12px; padding: 16px 18px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .kpi .lbl { font-size: 11px; text-transform: uppercase; color: #64748b; font-weight: 600; margin-bottom: 6px; }
  .kpi .val { font-size: 26px; font-weight: 800; }
  .state-msg { color: #64748b; font-size: 13px; padding: 20px 0; }
  .error-msg { color: #dc2626; font-size: 13px; padding: 12px 0; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; background: #dbeafe; color: #1d4ed8; }
</style>
</head>
<body>
  <div id="sidebar">
    <div class="brand"><img id="logo" src="" alt="" hidden><span id="company-name">idiibi CMMS</span></div>
    <button class="nav-btn active" data-view="dashboard">Dashboard</button>
    <button class="nav-btn" data-view="equipment">Equipment</button>
    <button class="nav-btn" data-view="tasks">Work Orders</button>
    <button class="nav-btn" data-view="projects">Projects</button>
    <button class="nav-btn" data-view="events">Project Events</button>
    <button class="nav-btn" data-view="firealarm">Fire Alarm</button>
    <button class="nav-btn" data-view="meters">Utility Meters</button>
    <button class="nav-btn" data-view="warehouse">Warehouse</button>
    <div class="spacer"></div>
    <button class="nav-btn" id="btn-refresh">Refresh</button>
    <button class="nav-btn" id="btn-logout">Log Out</button>
  </div>
  <div id="main"></div>
  <script src="app.js"></script>
</body>
</html>
